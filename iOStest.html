<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CM108 iOS LAN Diagnostic v2</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#111}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:16px;margin:12px 0}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
button,a{display:inline-block;margin:6px 6px 0 0;padding:11px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-size:15px}
.s{padding:10px;margin:8px 0;border-radius:9px;background:#eef2f7;word-break:break-word}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.wait{background:#fef3c7;color:#92400e}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#dbeafe;padding:12px;border-radius:10px;font-size:12px;max-height:380px;overflow:auto}
iframe{position:fixed;left:-10000px;top:-10000px;width:8px;height:8px;border:0}
small{color:#64748b}
</style>
</head>
<body><main>
<div class="card"><b>CM108 iOS LAN Diagnostic v2</b><br><small id="env"></small></div>
<div class="card">
<input id="base" value="http://192.168.1.102:8787">
<button id="run">ทดสอบ Hidden iframe</button>
<a id="direct" href="http://192.168.1.102:8787/api/public/network" target="_blank">เปิดตรง</a>
</div>
<div class="card">
<div id="iframeStatus" class="s">Hidden iframe: รอ</div>
<div id="frameImgStatus" class="s">iframe → favicon: รอ</div>
<div class="s">ถ้า iframe ผ่าน แม้ Fetch ก่อนหน้านี้ไม่ผ่าน = สามารถใช้วิธีนี้ทำ Auto LAN บน iOS ได้</div>
</div>
<div class="card"><button id="copy">คัดลอกผล</button><pre id="log"></pre></div>
</main>
<script>
const $=id=>document.getElementById(id), logEl=$('log');
$('env').textContent=`UA: ${navigator.userAgent} | Origin: ${location.origin}`;
function log(m,o){let s=`[${new Date().toISOString()}] ${m}`;if(o!==undefined)try{s+=' '+JSON.stringify(o)}catch(e){}logEl.textContent+=s+'\n'}
function st(id,k,t){const e=$(id);e.className='s '+k;e.textContent=t}
$('base').oninput=()=>{$('direct').href=$('base').value.replace(/\/$/,'')+'/api/public/network'};

function iframeProbe(url, timeout=10000){
  return new Promise((resolve,reject)=>{
    const f=document.createElement('iframe');
    const start=performance.now(); let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);setTimeout(()=>f.remove(),300)};
    f.onload=()=>{const ms=Math.round(performance.now()-start);cleanup();resolve({ms})};
    f.onerror=()=>{cleanup();reject(new Error('IFRAME_ERROR'))};
    const timer=setTimeout(()=>{cleanup();reject(new Error('IFRAME_TIMEOUT'))},timeout);
    f.src=url+(url.includes('?')?'&':'?')+'_='+Date.now();
    document.body.appendChild(f);
  });
}
$('run').onclick=async()=>{
  const b=$('base').value.trim().replace(/\/$/,'');
  log('RUN',{base:b});
  st('iframeStatus','wait','Hidden iframe: กำลังทดสอบ…');
  st('frameImgStatus','wait','iframe → favicon: กำลังทดสอบ…');
  try{
    const r=await iframeProbe(b+'/api/public/network',12000);
    st('iframeStatus','ok',`Hidden iframe: onload ผ่าน ${r.ms}ms`);
    log('IFRAME API ONLOAD',r);
  }catch(e){st('iframeStatus','bad','Hidden iframe: '+e.message);log('IFRAME API FAIL',e.message)}
  try{
    const r=await iframeProbe(b+'/favicon.ico',12000);
    st('frameImgStatus','ok',`iframe → favicon: onload ผ่าน ${r.ms}ms`);
    log('IFRAME FAVICON ONLOAD',r);
  }catch(e){st('frameImgStatus','bad','iframe → favicon: '+e.message);log('IFRAME FAVICON FAIL',e.message)}
};
$('copy').onclick=async()=>{
 const txt=`CM108 iOS LAN Diagnostic v2
UA: ${navigator.userAgent}
Origin: ${location.origin}
Base: ${$('base').value}
${$('iframeStatus').textContent}
${$('frameImgStatus').textContent}

${logEl.textContent}`;
 try{await navigator.clipboard.writeText(txt);$('copy').textContent='คัดลอกแล้ว'}catch(e){prompt('คัดลอก',txt)}
};
</script>
</body></html>
