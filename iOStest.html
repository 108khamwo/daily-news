<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CM108 Network Fingerprint Diagnostic</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#111}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:16px;margin:12px 0}
button{padding:12px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;margin:6px 6px 0 0}
.s{padding:12px;border-radius:9px;background:#eef2f7;margin:8px 0;word-break:break-all}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.wait{background:#fef3c7;color:#92400e}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#dbeafe;padding:12px;border-radius:10px;font-size:12px}
small{color:#64748b}
</style>
</head>
<body><main>
<div class="card">
<b>CM108 Network Fingerprint Diagnostic v1</b><br>
<small id="env"></small>
</div>
<div class="card">
<button id="run">ตรวจ Public IP</button>
<button id="copy">คัดลอกผล</button>
<div id="status" class="s">ยังไม่ได้ทดสอบ</div>
<div class="s">ให้เปิดหน้านี้ 3 ครั้ง: 1) คอมเครื่อง Monitor 2) iPhone ต่อ Wi‑Fi เดียวกัน 3) iPhone ปิด Wi‑Fi ใช้ 5G</div>
</div>
<div class="card"><pre id="log"></pre></div>
</main>
<script>
const $=id=>document.getElementById(id), logEl=$('log');
$('env').textContent=`UA: ${navigator.userAgent} | Origin: ${location.origin}`;
function log(m,o){let s=`[${new Date().toISOString()}] ${m}`;if(o!==undefined)try{s+=' '+JSON.stringify(o)}catch(e){}logEl.textContent+=s+'\n'}
function st(k,t){$('status').className='s '+k;$('status').textContent=t}

async function fetchJson(url, ms=15000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms), t0=performance.now();
  try{
    const r=await fetch(url,{cache:'no-store',signal:c.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    return {d,ms:Math.round(performance.now()-t0)};
  } finally { clearTimeout(t); }
}

async function getIp(){
  const endpoints=[
    ['ipify64','https://api64.ipify.org?format=json'],
    ['ipify4','https://api.ipify.org?format=json']
  ];
  let last=null;
  for(const [name,url] of endpoints){
    try{
      const r=await fetchJson(url);
      const ip=String(r.d.ip||'').trim();
      if(ip){ log(name+' PASS',{ip,ms:r.ms}); return {ip,source:name,ms:r.ms}; }
    }catch(e){ last=e; log(name+' FAIL',{name:e.name,message:e.message}); }
  }
  throw last||new Error('PUBLIC_IP_FAILED');
}
$('run').onclick=async()=>{
  st('wait','กำลังตรวจ…'); log('=== RUN ===');
  try{
    const r=await getIp();
    st('ok',`Public IP: ${r.ip} · ${r.source} · ${r.ms}ms`);
    log('RESULT',r);
  }catch(e){
    st('bad','ตรวจไม่ผ่าน: '+(e.message||e));
    log('FAIL',{name:e.name,message:e.message});
  }
};
$('copy').onclick=async()=>{
 const txt=`CM108 Network Fingerprint
UA: ${navigator.userAgent}
Origin: ${location.origin}
${$('status').textContent}

${logEl.textContent}`;
 try{await navigator.clipboard.writeText(txt);$('copy').textContent='คัดลอกแล้ว';setTimeout(()=>$('copy').textContent='คัดลอกผล',1500)}
 catch(e){prompt('คัดลอกผล',txt)}
};
</script>
</body></html>
