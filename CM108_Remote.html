<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CM108 Feed Probe v3</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#111}
main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #dbe2ea;border-radius:14px;padding:16px;margin:12px 0}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:6px 0;font-size:16px}
button{border:0;border-radius:9px;padding:12px 14px;background:#2563eb;color:#fff;font-size:15px}
.s{padding:10px;border-radius:8px;background:#eef2f7;margin:7px 0}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.wait{background:#fef3c7;color:#92400e}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#dbeafe;padding:12px;border-radius:10px;font-size:12px}
small{color:#64748b}
</style></head>
<body><main>
<div class="card"><b>CM108 Feed Probe v3</b><br><small id="env"></small></div>
<div class="card">
<input id="url" value="https://script.google.com/macros/s/AKfycbymdnOF5LRlctMC4dQRha9gOHpUgSvogyIGLj0AP79qFNTcTfeiDPpENMYRtgE21y-5YQ/exec">
<input id="pw" type="password" placeholder="viewer_password">
<button id="run">ทดสอบ Fast Feed Probe</button>
</div>
<div class="card">
<div id="a" class="s">Challenge: รอ</div>
<div id="b" class="s">Login: รอ</div>
<div id="c" class="s">Fast Feed Probe: รอ</div>
</div>
<div class="card"><pre id="log"></pre></div>
</main>
<script>
const $=x=>document.getElementById(x), log=t=>{$('log').textContent+=`[${new Date().toISOString()}] ${t}\n`};
$('env').textContent=`UA: ${navigator.userAgent} | Origin: ${location.origin}`;
function st(id,k,t){$(id).className='s '+k;$(id).textContent=t}
function jp(params,timeout,label){return new Promise((res,rej)=>{
 const cb='cm108Probe_'+Date.now().toString(36)+Math.random().toString(36).slice(2);
 const s=document.createElement('script'); const t0=performance.now(); let done=false;
 const clean=()=>{if(done)return;done=true;clearTimeout(timer);setTimeout(()=>{try{delete window[cb]}catch(e){};s.remove()},500)};
 window[cb]=d=>{const ms=Math.round(performance.now()-t0);log(`${label} callback ${ms}ms ${JSON.stringify(d)}`);clean();res({d,ms})};
 s.onload=()=>log(`${label} onload ${Math.round(performance.now()-t0)}ms`);
 s.onerror=()=>{clean();rej(new Error('LOAD_FAILED'))};
 const timer=setTimeout(()=>{clean();rej(new Error('TIMEOUT'))},timeout);
 const u=new URL($('url').value.trim());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());
 s.src=u.toString();document.head.appendChild(s);
})}
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function hmac(pw,ch){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pw),{name:'HMAC',hash:'SHA-256'},false,['sign']);return b64u(new Uint8Array(await crypto.subtle.sign('HMAC',k,e.encode(ch))))}
$('run').onclick=async()=>{
 $('log').textContent='';const pw=$('pw').value;if(!pw)return alert('กรอกรหัสก่อน');
 try{
  st('a','wait','Challenge: กำลังทดสอบ');const a=await jp({api:'auth_challenge'},45000,'challenge');if(!a.d.ok)throw Error(a.d.error||'challenge failed');st('a','ok',`Challenge: ผ่าน ${a.ms}ms`);
  st('b','wait','Login: กำลังทดสอบ');const proof=await hmac(pw,a.d.challenge);const b=await jp({api:'auth_login',challenge:a.d.challenge,proof,remember:'1'},45000,'login');if(!b.d.ok||!b.d.token)throw Error(b.d.error||'login failed');st('b','ok',`Login: ผ่าน ${b.ms}ms`);
  st('c','wait','Fast Feed Probe: รอสูงสุด 45 วินาที');const c=await jp({api:'feed_probe_fast',token:b.d.token,limit:'20'},45000,'fast_probe');if(!c.d.ok)throw Error(c.d.error||'probe failed');
  const tm=c.d.timings||{};st('c','ok',`Fast Feed Probe: ผ่าน ${c.ms}ms | server ${tm.total_ms||'?'}ms | scan ${c.d.scanned_rows}/${c.d.total_rows} แถว`);
 }catch(e){log('FAIL '+e.message); if($('c').className.includes('wait'))st('c','bad','Fast Feed Probe: '+e.message)}
};
</script></body></html>
