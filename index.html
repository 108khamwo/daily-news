    <script>
    (() => {
        const CURRENT_DASHBOARD_VERSION = '0.1.83';
        const CHECK_EVERY_MS = 60000;
        const RELOAD_ATTEMPT_KEY = 'cm108_dashboard_reload_attempt_v165';
        let checking = false;
        let reloading = false;

        // Remove only our temporary cache-busting parameter after a forced reload.
        try {
            const clean = new URL(location.href);
            if (clean.searchParams.has('__cm108_reload')) {
                clean.searchParams.delete('__cm108_reload');
                history.replaceState(null, '', clean.pathname + clean.search + clean.hash);
            }
        } catch (e) {}

        const getReloadAttempt = () => {
            try { return sessionStorage.getItem(RELOAD_ATTEMPT_KEY) || ''; }
            catch (e) { return ''; }
        };

        const setReloadAttempt = (version) => {
            try { sessionStorage.setItem(RELOAD_ATTEMPT_KEY, String(version || '')); }
            catch (e) {}
        };

        const clearReloadAttempt = () => {
            try { sessionStorage.removeItem(RELOAD_ATTEMPT_KEY); }
            catch (e) {}
        };

        const forceLatestReloadOnce = (remoteVersion) => {
            if (reloading || !remoteVersion) return;

            // Important: never enter an infinite reload loop if GitHub serves
            // dashboard-version.json before the matching index.html is available.
            if (getReloadAttempt() === remoteVersion) return;
            setReloadAttempt(remoteVersion);

            reloading = true;
            const next = new URL(location.href);
            next.searchParams.set('__cm108_reload', String(Date.now()));
            location.replace(next.toString());
        };

        const checkForDashboardUpdate = async () => {
            if (checking || reloading) return;
            checking = true;
            try {
                const url = new URL('dashboard-version.json', location.href);
                url.searchParams.set('_', String(Date.now()));
                const response = await fetch(url.toString(), {
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                if (!response.ok) return;

                const data = await response.json();
                const remote = String(data && data.version || '').trim();
                if (!remote) return;

                if (remote === CURRENT_DASHBOARD_VERSION) {
                    clearReloadAttempt();
                    return;
                }

                forceLatestReloadOnce(remote);
            } catch (e) {
                // No fallback reload here. If the version file is temporarily
                // unavailable, leaving the current dashboard open is safer than
                // repeatedly refreshing the page.
            } finally {
                checking = false;
            }
        };

        setTimeout(checkForDashboardUpdate, 8000);
        setInterval(checkForDashboardUpdate, CHECK_EVERY_MS);
        window.addEventListener('focus', checkForDashboardUpdate);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkForDashboardUpdate();
        });
    })();
    </script>

const isIOSMobile = () => {
    if (typeof navigator === 'undefined')
        return false;
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const isIPhoneOrIPod = /iPhone|iPod/i.test(ua);
    const isIPadOS = /iPad/i.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return isIPhoneOrIPod || isIPadOS;
};
// บันทึกรูปให้รองรับ Safari บน iPhone/iPad รุ่นใหม่
// iOS ใช้ Share Sheet โดยส่งไฟล์ PNG ต้นฉบับจาก Canvas โดยตรง
const canvasToBlob = (canvas, type = 'image/png', quality = 0.95) => {
    return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
            if (blob)
                resolve(blob);
            else
                reject(new Error('ไม่สามารถสร้างไฟล์รูปภาพได้'));
        }, type, quality);
    });
};
const dataUrlToBlob = async (dataUrl) => {
    const response = await fetch(dataUrl);
    if (!response.ok)
        throw new Error('ไม่สามารถอ่านข้อมูลรูปภาพได้');
    return response.blob();
};
const openExactImageOnIOS = async ({ blob, filename = 'news-image.png' }) => {
    const objectUrl = URL.createObjectURL(blob);
    const targetWindow = window.open('', '_blank');
    if (!targetWindow) {
        URL.revokeObjectURL(objectUrl);
        alert('Safari ไม่สามารถเปิดรูปภาพได้ กรุณาอนุญาต Pop-up แล้วลองอีกครั้ง');

</body>
</html>`);
    targetWindow.document.close();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 10 * 60 * 1000);
    return true;
};
const saveImageToDevice = async ({ canvas = null, dataUrl = '', filename = 'news-image.png', mimeType = 'image/png' }) => {
    try {
        let blob;
        if (canvas) {
            // บังคับใช้ PNG เพื่อรักษาความคมของกรอบและตัวหนังสือ
            const exactDataUrl = canvas.toDataURL('image/png');
            blob = await dataUrlToBlob(exactDataUrl);
        }
        else {
            blob = await dataUrlToBlob(dataUrl);
        }
        const actualType = blob.type || mimeType || 'image/png';
        const safeFilename = /\.[a-z0-9]+$/i.test(filename)
            ? filename.replace(/\.[a-z0-9]+$/i, '.png')
            : `${filename}.png`;
        const file = new File([blob], safeFilename, { type: actualType });
        if (isIOSMobile()) {
            const canShareFile = typeof navigator.share === 'function' &&
                (typeof navigator.canShare !== 'function' || navigator.canShare({ files: [file] }));
            if (canShareFile) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'บันทึกรูปภาพ'
                    });
                    return true;
                }

const processImage = (file, maxSizeKB = 700) => {
    return new Promise((resolve) => {
        if (file.size <= maxSizeKB * 1024) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
        }
        else {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let width = img.width;
                let height = img.height;
                const targetWidth = 1600;
                if (width > targetWidth) {
                    height = Math.round(height * (targetWidth / width));
                    width = targetWidth;
                }
                canvas.width = width;
                canvas.height = height;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.95));
            };
            img.src = URL.createObjectURL(file);
        }
    });

const fetchGlobalSearchIndexWithRest = async () => {

const loadFullNewsDocuments = async (items) => {
    const output = new Array(items.length);
    let cursor = 0;
    const workerCount = Math.min(6, Math.max(1, items.length));
    const worker = async () => {
        while (true) {
            const index = cursor++;
            if (index >= items.length)
                return;
            const item = items[index];
            if (globalSearchFullDocCache.has(item.id)) {
                output[index] = globalSearchFullDocCache.get(item.id);
                continue;
            }
            try {
                const snapshot = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'news', item.id));
                if (snapshot.exists()) {
                    const fullItem = { id: snapshot.id, ...snapshot.data() };
                    globalSearchFullDocCache.set(item.id, fullItem);
                    output[index] = fullItem;
                }
            }
            catch (error) {
                console.error('โหลดข่าวจากผลค้นหาไม่สำเร็จ', item.id, error);
            }
        }
    };
    await Promise.all(Array.from({ length: workerCount }, () => worker()));

};

    const prepareFloatingDocument = (floatWindow, mode) => {

    const loadRemoteCloudFeed = async (silent = false) => {

                }
                throw new Error(String(data && data.error || 'REMOTE_ERROR'));

            const items = (Array.isArray(data.items) ? data.items : []).map(x => ({

                page_name: x.page_name || '',

            setRemoteError('');
        } catch (e) {
            console.warn('Google Remote feed error', e);

            setRemoteAuthState(remoteItems.length ? 'ready' : 'error');

    // v0.1.49: read the Admin display setting first, then request exactly that
    // amount of news. This makes 10/20/30/all authoritative and avoids any
    // stale/default LIMIT in /api/public/latest forcing the sidebar to 20.
    const fetchMonitorSnapshot = async (base, timeoutMs) => {
        let publicConfig = null;
        try {
            const cfgResponse = await fetchFacebookMonitor(`${base}/api/public/config`, timeoutMs);
            if (cfgResponse.ok) publicConfig = await cfgResponse.json();
        } catch (e) {
            // Older Monitor versions do not have /api/public/config. Fall back
            // to the backward-compatible latest endpoint below.
        }

        if (publicConfig && publicConfig.display_limit !== undefined && publicConfig.display_limit !== null) {
            const wanted = normalizeDisplayLimit(publicConfig.display_limit);
            const latestUrl = wanted === 0
                ? `${base}/api/public/latest`
                : `${base}/api/public/latest?limit=${wanted}`;
            const response = await fetchFacebookMonitor(latestUrl, timeoutMs);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const latestData = await response.json();
            return {
                ...latestData,
                display_limit: wanted,
                check_interval_minutes: publicConfig.check_interval_minutes ?? latestData.check_interval_minutes,
                history_hours: publicConfig.history_hours ?? latestData.history_hours,
                monitor_version: publicConfig.version || latestData.version || null,
                mdns_url: publicConfig.mdns_url || latestData.mdns_url || FB_MONITOR_MDNS_URL,
                lan_url: publicConfig.lan_url || latestData.lan_url || null,
                system_hostname: publicConfig.system_hostname || latestData.system_hostname || null,
                system_url: publicConfig.system_url || latestData.system_url || null
            };
        }

        let response = await fetchFacebookMonitor(`${base}/api/public/latest`, timeoutMs);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let data = await response.json();
        if (data.display_limit === undefined || data.display_limit === null) {
            const legacyResponse = await fetchFacebookMonitor(`${base}/api/public/latest?limit=20`, timeoutMs);
            if (legacyResponse.ok) {
                const legacyData = await legacyResponse.json();
                data = { ...legacyData, display_limit: 20 };
            } else {
                data = { ...data, display_limit: 20 };
            }
        }
        return data;
    };

    const fetchAvailableMonitorSnapshot = async (timeoutMs) => {
        let lastError = null;
        const candidates = getFacebookMonitorCandidates(monitorBaseRef.current || monitorBase);
        for (let i = 0; i < candidates.length; i++) {
            const base = candidates[i];
            let tryTimeout;
            if (FB_MONITOR_IS_IOS_GITHUB) tryTimeout = Math.min(timeoutMs, 3500);
            else if (base === FB_MONITOR_LOOPBACK_URL) tryTimeout = Math.min(timeoutMs, 1400);
            else if (base === FB_MONITOR_MDNS_URL) tryTimeout = Math.min(timeoutMs, 4500);
            else tryTimeout = i <= 2 ? Math.min(timeoutMs, 5000) : Math.min(timeoutMs, 3500);
            try {
                const data = await fetchMonitorSnapshot(base, tryTimeout);
                monitorBaseRef.current = base;
                rememberFacebookMonitorNetwork(data, base);
                return { data, base };
            } catch (error) {
                lastError = error;
            }
        }
        // Normal candidates failed. The saved numeric address may be stale after
        // DHCP renewal, so discover the same Monitor on the last-known subnet.
        const discovered = await discoverFacebookMonitorBySubnet(monitorBaseRef.current || monitorBase);
        if (discovered && discovered.base) {
            try {
                const data = await fetchMonitorSnapshot(discovered.base, Math.min(timeoutMs, 5000));
                monitorBaseRef.current = discovered.base;
                rememberFacebookMonitorNetwork({ ...discovered.data, ...data }, discovered.base);
                return { data: { ...discovered.data, ...data }, base: discovered.base };
            } catch (error) { lastError = error; }
        }
        throw lastError || new Error('ไม่พบ Monitor ใน LAN');
    };

    // v0.1.83: LAN detection remains quiet and handles Chrome 145+ split LAN/loopback permissions. It also no longer gives up after only
    // 1.6-1.8 seconds. That was too short for Chromium Local Network Access
    // permission and could incorrectly switch a same-LAN user to Google Remote.
    // All candidates still run in parallel and the first successful one wins.
    const fetchQuickMonitorSnapshot = async () => {
        const candidates = getFacebookMonitorCandidates(monitorBaseRef.current || monitorBase);
        const checks = candidates.map(async base => {
            const timeout = base === FB_MONITOR_LOOPBACK_URL ? 1500 : (base === FB_MONITOR_MDNS_URL ? 5500 : 5000);
            const data = await fetchMonitorSnapshot(base, timeout);
            return { data, base };
        });
        let found = null;
        if (typeof Promise.any === 'function') {
            try { found = await Promise.any(checks); } catch (e) { found = null; }
        } else {
            const wrapped = checks.map(p => p.catch(() => null));
            const results = await Promise.all(wrapped);
            found = results.find(Boolean) || null;
        }
        if (!found) throw new Error('ไม่พบ Monitor ใน LAN');
        monitorBaseRef.current = found.base;
        rememberFacebookMonitorNetwork(found.data, found.base);
        return found;
    };

    const recoverLanBySubnetInBackground = async () => {
        if (FB_MONITOR_IS_LOCAL_DASHBOARD || FB_MONITOR_IS_IOS_GITHUB || subnetDiscoveryBusyRef.current) return;
        const now = Date.now();
        if ((now - lastSubnetDiscoveryAtRef.current) < 5 * 60 * 1000) return;
        lastSubnetDiscoveryAtRef.current = now;
        subnetDiscoveryBusyRef.current = true;
        try {
            const discovered = await discoverFacebookMonitorBySubnet(monitorBaseRef.current || monitorBase);
            if (discovered && discovered.base) {
                const data = await fetchMonitorSnapshot(discovered.base, 4000);
                monitorBaseRef.current = discovered.base;
                rememberFacebookMonitorNetwork({ ...discovered.data, ...data }, discovered.base);
                setAllNewsBase(resolveFacebookMonitorAllNewsBase(data, discovered.base));
                setFeedMode('lan');
                setMonitorState({
                    loading: false, connected: true, running: Boolean(data.running), updatedAt: data.updated_at || null,
                    checkIntervalMinutes: Math.max(1, Number(data.check_interval_minutes) || 10),
                    displayLimit: normalizeDisplayLimit(data.display_limit)
                });
                const limit = normalizeDisplayLimit(data.display_limit);
                const items = applyDisplayLimit(Array.isArray(data.items) ? data.items : [], limit);
                initializedRef.current = true;
                displayLimitRef.current = limit;
                knownItemIdsRef.current = new Set(items.map(getItemKey));
                setPlayItems(items);
            }
        } catch (e) {
            // Staying on Cloud is expected when the user is really outside the LAN.
        } finally { subnetDiscoveryBusyRef.current = false; }
    };

    useEffect(() => {
        const onRemoteMessage = (event) => {
            const origin = String(event.origin || '');

            if (!trustedGoogle || payload.type !== 'cm108-remote-news') return;

    useEffect(() => {
        let alive = true;
        setShowConnectionWarning(false);
        setShowWarningDetails(false);
        if (connectionWarningTimerRef.current) {
            clearTimeout(connectionWarningTimerRef.current);
            connectionWarningTimerRef.current = null;
        }
        const loadLatest = async () => {
            if (!monitorBase) {
                setMonitorState({ loading: false, connected: false, running: false, updatedAt: null, checkIntervalMinutes: 10, displayLimit: 20 });
                return;
            }
            try {
                const pstate = await getFacebookMonitorPermissionState();
                if (alive) setPermissionState(pstate);
                // v0.1.43: รอบแรกเผื่อเวลาให้ผู้ใช้กด Allow ที่ Local Network Access
                // เดิม 3.5 วินาทีสั้นเกินไปและอาจตัด request ระหว่าง permission prompt
                const result = await fetchQuickMonitorSnapshot();
                const data = result.data;
                const usedMonitorBase = result.base;
                if (!alive) return;
                const nextAllNewsBase = resolveFacebookMonitorAllNewsBase(data, usedMonitorBase);
                setAllNewsBase(nextAllNewsBase);
                setFeedMode('lan');
                rememberFacebookMonitorNetwork(data, usedMonitorBase);

                // iPhone/iPad: if Safari can confirm that the Monitor is online,
                // move to the same-origin local dashboard. This avoids HTTPS ->
                // HTTP LAN restrictions for the news ticker. The GitHub URL is
                // carried along so the local page can return here if Monitor stops.
                if (FB_MONITOR_IS_IOS_GITHUB) {
                    const localUrl = buildFacebookMonitorLocalDashboardUrl(usedMonitorBase || FB_MONITOR_MDNS_URL);
                    window.location.replace(localUrl);
                    return;
                }
                setIosLocalFallback(false);

                // API เรียงใหม่ -> เก่า และจำนวนข่าวใช้ค่าจากฝั่ง Admin (10/20/30/ทั้งหมด)
                const nextDisplayLimit = normalizeDisplayLimit(data.display_limit);
                const nextItems = applyDisplayLimit(Array.isArray(data.items) ? data.items : [], nextDisplayLimit);
                const nextUpdatedAt = data.updated_at || null;
                const nextInterval = Math.max(1, Number(data.check_interval_minutes) || 10);
                if (connectionWarningTimerRef.current) {
                    clearTimeout(connectionWarningTimerRef.current);
                    connectionWarningTimerRef.current = null;
                }
                everConnectedRef.current = true;
                setHasConnectedThisSession(true);
                getFacebookMonitorPermissionState().then(state => { if (alive) setPermissionState(state); }).catch(() => {});
                setShowConnectionWarning(false);
                setShowWarningDetails(false);
                setMonitorState({ loading: false, connected: true, running: Boolean(data.running), updatedAt: nextUpdatedAt, checkIntervalMinutes: nextInterval, displayLimit: nextDisplayLimit });

                if (nextUpdatedAt && nextUpdatedAt !== lastUpdatedAtRef.current) {
                    lastUpdatedAtRef.current = nextUpdatedAt;
                    setShowUpdateNotice(true);
                    if (updateNoticeTimerRef.current) clearTimeout(updateNoticeTimerRef.current);
                    updateNoticeTimerRef.current = setTimeout(() => {
                        setShowUpdateNotice(false);
                        updateNoticeTimerRef.current = null;
                    }, 5000);
                }

                if (!initializedRef.current) {
                    initializedRef.current = true;
                    displayLimitRef.current = nextDisplayLimit;
                    knownItemIdsRef.current = new Set(nextItems.map(getItemKey));
                    setPlayItems(nextItems);
                    requestAnimationFrame(() => {
                        if (tickerViewportRef.current) tickerViewportRef.current.scrollTop = 0;
                    });
                    return;
                }

                // ถ้า Admin เปลี่ยน 10/20/30/ทั้งหมด รายการเก่าที่เพิ่งถูกเปิดให้เห็น
                // ไม่ควรถูกนับเป็น “ข่าวใหม่”
                if (displayLimitRef.current !== nextDisplayLimit) {
                    displayLimitRef.current = nextDisplayLimit;
                    knownItemIdsRef.current = new Set(nextItems.map(getItemKey));
                    setPendingCount(0);
                    setBrowsingState(false);
                    setPlayItems(nextItems);
                    requestAnimationFrame(() => {
                        if (tickerViewportRef.current) tickerViewportRef.current.scrollTop = 0;
                    });
                    return;
                }

                const freshItems = nextItems.filter(item => !knownItemIdsRef.current.has(getItemKey(item)));
                nextItems.forEach(item => knownItemIdsRef.current.add(getItemKey(item)));
                if (freshItems.length > 0) {
                    const viewport = tickerViewportRef.current;
                    const wasBrowsingOlder = browsingOlderRef.current || !isViewportAtLatest();
                    const oldScrollHeight = viewport ? viewport.scrollHeight : 0;
                    const oldScrollTop = viewport ? viewport.scrollTop : 0;
                    setPlayItems(nextItems);
                    if (wasBrowsingOlder) {
                        setBrowsingState(true);
                        setPendingCount(prev => nextDisplayLimit === 0 ? prev + freshItems.length : Math.min(nextDisplayLimit, prev + freshItems.length));
                        // เพิ่มข่าวใหม่ไว้ด้านบน แต่รักษาตำแหน่งข่าวเก่าที่ผู้ใช้กำลังอ่านอยู่
                        requestAnimationFrame(() => {
                            const v = tickerViewportRef.current;
                            if (!v) return;
                            const delta = Math.max(0, v.scrollHeight - oldScrollHeight);
                            v.scrollTop = oldScrollTop + delta;
                        });
                    } else {
                        requestAnimationFrame(() => {
                            if (tickerViewportRef.current) tickerViewportRef.current.scrollTop = 0;
                        });
                    }
                } else {
                    setPlayItems(nextItems);
                }
            } catch (error) {
                if (!alive) return;
                console.warn('เชื่อมต่อ Facebook News Chiang Mai Monitor 24 Hrs. ไม่สำเร็จ', error);

                // If an iPhone/iPad was handed from GitHub to the local page and
                // the Monitor later stops, return to the normal GitHub dashboard.
                // The main news page therefore remains usable even when Monitor is off.
                if (FB_MONITOR_IS_LOCAL_DASHBOARD && localReturnUrlRef.current && everConnectedRef.current) {
                    window.location.replace(localReturnUrlRef.current);
